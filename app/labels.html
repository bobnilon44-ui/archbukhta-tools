<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АрхБухта · Печать QR</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/labels.css">
</head>
<body>
  <div class="controls no-print">
    <b>Печать QR-кодов</b>
    <label>Что печатать
      <select id="what">
        <option value="teams=all">Бейджи всех команд</option>
        <option value="items=all">Все инструменты и аккумуляторы</option>
        <option value="consumables=all">Расходники (на коробки)</option>
      </select>
    </label>
    <label>Размер
      <select id="size">
        <option value="badge">Бейдж 90×60 мм</option>
        <option value="large">Наклейка 60×60 мм</option>
        <option value="medium" selected>Наклейка 45×45 мм</option>
        <option value="small">Наклейка 32×32 мм</option>
      </select>
    </label>
    <label><input type="checkbox" id="cut" checked> линии реза</label>
    <button id="btn-print">Печать / сохранить PDF ↓</button>
    <span id="count" class="muted"></span>
    <p class="tip">В окне печати выберите «Сохранить как PDF», масштаб 100%, поля — «нет» или «минимальные».
      Для ламинирования оставляйте линии реза. Перед печатью всей партии проверьте пару QR кассой.</p>
  </div>
  <div id="sheet" class="sheet"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/labels.js"></script>
</body>
</html>
